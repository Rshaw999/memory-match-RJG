<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Memory Match</h1>
  <section id="win-message" class="win-inline" aria-labelledby="win-title" aria-live="polite" aria-atomic="true" aria-hidden="true">
    <div class="win-inline-clip">
      <div class="win-inline-layout">
        <div>
          <p class="win-kicker">Field notes complete</p>
          <h2 id="win-title">Every pair discovered!</h2>
          <p>You found them all in <strong id="win-move-count"></strong> moves.</p>
        </div>
      </div>
    </div>
  </section>

  <div class="game-toolbar">
    <p id="status" aria-live="polite" aria-atomic="true"></p>
    <button id="new-game" class="new-game-button" type="button">New game</button>
  </div>
  <div id="table"></div>

  <!-- Order matters: the contract first, then deck, rules, and screen. -->
  <script src="state.js"></script>
  <script src="deck.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
